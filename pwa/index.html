// מיון קבצים
let _fileSort = 'date'; // 'name' | 'sender' | 'date' | 'type'

function _sortFiles(files) {
  return [...files].sort((a, b) => {
    if (_fileSort === 'name') {
      return (a.name||'').localeCompare(b.name||'', 'he');
    } else if (_fileSort === 'sender') {
      const as = a.source?.senderName || a.source?.senderEmail || a.senderName || '';
      const bs = b.source?.senderName || b.source?.senderEmail || b.senderName || '';
      return as.localeCompare(bs, 'he');
    } else if (_fileSort === 'type') {
      const ae = (a.name||'').split('.').pop().toLowerCase();
      const be = (b.name||'').split('.').pop().toLowerCase();
      return ae.localeCompare(be);
    } else { // date
      const ad = a.source?.date || a.sentDate || a.detectedAt || a.createdAt || '';
      const bd = b.source?.date || b.sentDate || b.detectedAt || b.createdAt || '';
      return bd.localeCompare(ad); // חדש קודם
    }
  });
}

function _fileGroupKey(file, sort) {
  if (sort === 'name') {
    const first = (file.name || '?')[0].toUpperCase();
    // אות עברית / לטינית / מספר
    if (/[א-ת]/.test(first)) return first;
    if (/[A-Z]/.test(first)) return first;
    if (/[0-9]/.test(first)) return '0–9';
    return '#';
  }
  if (sort === 'sender') {
    const s = file.source?.senderName || file.source?.senderEmail || file.senderName || file.sender || '';
    return s || 'ללא שולח';
  }
  if (sort === 'type') {
    const ext = ((file.name || '').match(/\.([a-zA-Z0-9]{1,6})$/) || [])[1]?.toUpperCase() || '';
    return ext || 'אחר';
  }
  // date
  const raw = file.source?.date || file.sentDate || file.detectedAt || file.createdAt;
  if (!raw) return 'ללא תאריך';
  const d = new Date(raw);
  return d.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
}

// ── נרמול קובץ — תמיכה בשני פורמטים ─────────────────────
function _normalizeFile(raw) {
  if (!raw) return null;
  const hasSrc = !!(raw.source || raw.sizeBytes !== undefined);
  if (hasSrc) {
    const src = raw.source || {};
    const name = raw.name || raw.systemName || raw.physicalName || src.subject || 'קובץ';
    return {
      name,
      ext:              (name.split('.').pop() || '').toLowerCase(),
      mimeType:         raw.mimeType || 'application/octet-stream',
      sizeBytes:        raw.sizeBytes || raw.size || 0,
      gmailMessageId:   raw.gmailMessageId || src.messageId || null,
      gmailAttachmentId:raw.gmailAttachmentId || raw.attachmentId || null,
      messageId:        raw.gmailMessageId || src.messageId || null,
      attachmentId:     raw.gmailAttachmentId || raw.attachmentId || null,
      threadId:         raw.threadId || src.threadId || null,
      senderName:       src.senderName || raw.senderName || raw.sender || null,
      senderEmail:      src.senderEmail || raw.senderEmail || null,
      date:             src.date || raw.sentDate || raw.detectedAt || raw.createdAt || null,
      driveFileId:      raw.driveFileId || raw.driveId || null,
      webViewLink:      raw.webViewLink || null,
    };
  }
  const name = raw.filename || raw.name || raw.systemName || raw.physicalName || 'קובץ';
  return {
    name,
    ext:              (name.split('.').pop() || '').toLowerCase(),
    mimeType:         raw.mimeType || 'application/octet-stream',
    sizeBytes:        raw.size || raw.sizeBytes || 0,
    gmailMessageId:   raw.messageId || null,
    gmailAttachmentId:raw.attachmentId || null,
    messageId:        raw.messageId || null,
    attachmentId:     raw.attachmentId || null,
    threadId:         raw.threadId || null,
    senderName:       raw.senderName || raw.fromName || raw.sender || null,
    senderEmail:      raw.senderEmail || raw.fromEmail || null,
    date:             raw.date || raw.sentDate || null,
    driveFileId:      raw.driveFileId || raw.driveId || null,
    webViewLink:      raw.webViewLink || null,
  };
}

// ── שליפת buffer מ-Gmail API ──────────────────────────────
async function _fetchGmailBuffer(file) {
  const msgId = file.gmailMessageId || file.messageId;
  const attId = file.gmailAttachmentId || file.attachmentId;
  if (!msgId || !attId) throw new Error('חסרים פרטי Gmail');
  const r = await fetch(
    'https://gmail.googleapis.com/gmail/v1/users/me/messages/' + msgId + '/attachments/' + attId,
    { headers: { Authorization: 'Bearer ' + state.token } }
  );
  if (!r.ok) throw new Error('Gmail API ' + r.status);
  const data = await r.json();
  const b64raw = (data.data || '').replace(/-/g,'+').replace(/_/g,'/');
  const b64    = b64raw.padEnd(b64raw.length + (4 - b64raw.length % 4) % 4, '=');
  const bin    = atob(b64);
  const u8     = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return { buffer: u8.buffer, mime: file.mimeType || 'application/octet-stream' };
}

// ── תצוגה מוקדמת של קובץ ──────────────────────────────────
function _showFilePreview(rawFile) {
  const file = _normalizeFile(rawFile);
  if (!file) return;

  const ext  = file.ext;
  const mime = file.mimeType;
  const sizeB = file.sizeBytes || 0;
  const size  = sizeB > 0 ? (sizeB > 1048576 ? (sizeB/1048576).toFixed(1)+'MB' : Math.round(sizeB/1024)+'KB') : '';
  const date  = file.date ? new Date(file.date).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';

  // קישור לפתיחה ב-Drive / Gmail
  const viewLink = file.webViewLink
    || (file.driveFileId ? 'https://drive.google.com/file/d/'+file.driveFileId+'/view' : '')
    || (file.threadId    ? 'https://mail.google.com/mail/u/0/#inbox/'+file.threadId    : '');

  // Drive embed URL — משמש לכל הקבצים שנמצאים ב-Drive
  const drivePreviewUrl = file.driveFileId
    ? 'https://drive.google.com/file/d/'+file.driveFileId+'/preview'
    : (file.webViewLink ? file.webViewLink.replace(/\/view(\?.*)?$/, '/preview') : null);

  const _isPdf  = ext === 'pdf' || mime === 'application/pdf';
  const _isImg  = ['jpg','jpeg','png','gif','webp','bmp','svg','heic'].includes(ext) || mime.startsWith('image/');
  const _isWord = ['docx','odt'].includes(ext);
  const _isDoc  = ext === 'doc';
  const _isXls  = ['xls','xlsx','csv'].includes(ext);
  const _isPpt  = ['ppt','pptx','odp'].includes(ext);
  const _isTxt  = ['txt','rtf','md','json','xml','html','htm','css','js','ts','py'].includes(ext);

  // icon & label
  const _ICONS = { pdf:'📕', doc:'📘', docx:'📘', xls:'📗', xlsx:'📗', csv:'📗',
                   ppt:'📙', pptx:'📙', jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️',
                   webp:'🖼️', heic:'🖼️', mp4:'🎬', mov:'🎬', mp3:'🎵', wav:'🎵',
                   zip:'📦', rar:'📦', txt:'📝', rtf:'📝', md:'📝', eml:'📧' };
  const iconLabel = _ICONS[ext] || '📎';

  // meta rows
  const metaRows =
    (file.senderName ? '<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--surface2);font-size:13px;"><span style="color:var(--text-3);min-width:56px;">שולח</span><span style="font-weight:500;">'+esc(file.senderName)+'</span></div>' : '')
    + (date           ? '<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--surface2);font-size:13px;"><span style="color:var(--text-3);min-width:56px;">תאריך</span><span style="font-weight:500;">'+date+'</span></div>' : '')
    + (size           ? '<div style="display:flex;gap:10px;padding:8px 0;font-size:13px;"><span style="color:var(--text-3);min-width:56px;">גודל</span><span style="font-weight:500;">'+size+'</span></div>' : '');

  document.getElementById('file-preview-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'file-preview-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;';

  overlay.innerHTML =
    '<div id="file-preview-card" style="background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .25s ease;">'
      + '<div style="width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0;"></div>'
      + '<div style="display:flex;align-items:center;gap:12px;padding:14px 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0;">'
          + '<span style="font-size:28px;">'+iconLabel+'</span>'
          + '<div style="flex:1;min-width:0;">'
            + '<div style="font-size:15px;font-weight:700;line-height:1.3;word-break:break-word;">'+esc(file.name.replace(/\.[^.]+$/, ''))+'</div>'
            + '<div style="font-size:11px;color:var(--text-3);margin-top:2px;">'+ext.toUpperCase()+(size?' · '+size:'')+'</div>'
          + '</div>'
          + '<button onclick="document.getElementById(\'file-preview-overlay\').remove()" style="width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);font-size:16px;cursor:pointer;flex-shrink:0;">✕</button>'
      + '</div>'
      + '<div id="fp-preview-zone" style="overflow-y:auto;padding:14px 20px;flex:1;">'
          + '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:var(--text-3);gap:10px;">'
            + '<div class="spinner"></div><span style="font-size:13px;">טוען תצוגה מוקדמת...</span>'
          + '</div>'
      + '</div>'

            ? '<a href="'+esc(viewLink)+'" target="_blank" rel="noopener" style="display:block;padding:13px;border-radius:12px;background:var(--accent);color:white;font-size:14px;font-weight:700;text-align:center;text-decoration:none;font-family:var(--sans);">פתח ב-Drive ↗</a>'
            : '<div style="padding:13px;border-radius:12px;background:var(--surface2);color:var(--text-3);font-size:14px;font-weight:600;text-align:center;">אין קישור זמין</div>')

  const zone = document.getElementById('fp-preview-zone');

  function _noPreview(reason) {

  // ════ Drive embed — עובד על כל מכשיר, כל פורמט ════

        + 'style="width:100%;height:340px;border:none;display:block;" '

  // ════ ללא driveId — שולף מ-Gmail ומעלה ל-Drive זמנית ════

  // לכל סוגי הקבצים (PDF, Word, Excel, PPT, תמונות)
  (async () => {
    const msgId = file.gmailMessageId || file.messageId;

    if (!msgId || !attId) {

    try {

      const { buffer, mime: fetchedMime } = await _fetchGmailBuffer(file);

      // שלב 2: תמונה — לא צריך Upload, blob ישירות
      if (_isImg) {
        const blob    = new Blob([buffer], { type: fetchedMime });
        const blobUrl = URL.createObjectURL(blob);
        _done('<div style="background:#111;border-radius:10px;overflow:hidden;margin-bottom:12px;'
            + 'display:flex;align-items:center;justify-content:center;min-height:160px;">'
            + '<img src="'+blobUrl+'" style="max-width:100%;max-height:320px;object-fit:contain;display:block;">'
            + '</div>');
        setTimeout(() => URL.revokeObjectURL(blobUrl), 300000);
        return;
      }

      // שלב 3: טקסט — ישירות מה-buffer
      if (_isTxt) {
        const text = new TextDecoder('utf-8').decode(buffer);
        _done('<div style="background:#1e1e1e;border-radius:10px;padding:16px;margin-bottom:12px;max-height:340px;overflow-y:auto;">'
            + '<pre style="margin:0;font-size:12px;color:#d4d4d4;font-family:monospace;white-space:pre-wrap;word-break:break-all;">'
            + esc(text.slice(0, 5000)) + (text.length > 5000 ? '\n\n[...]' : '')
            + '</pre></div>');
        return;
      }

      // שלב 4: PDF, Word, Excel — העלה ל-Drive → Drive Preview
      if (_isPdf || _isWord || _isDoc || _isXls || _isPpt) {
        if (zone) zone.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;'
          + 'justify-content:center;padding:24px;color:var(--text-3);gap:10px;">'
          + '<div class="spinner"></div>'
          + '<span style="font-size:13px;">מעלה לתצוגה מוקדמת...</span>'
          + '</div>' + metaRows;

        const tempId = await _uploadToDriveTemp(buffer, fetchedMime, file.name);

        if (tempId) {
          const previewUrl = 'https://drive.google.com/file/d/' + tempId + '/preview';
          if (zone) zone.innerHTML =
            '<div style="border-radius:10px;overflow:hidden;border:1px solid var(--border);margin-bottom:12px;">'
              + '<iframe src="' + previewUrl + '" '
              + 'style="width:100%;height:380px;border:none;display:block;" '
              + 'sandbox="allow-scripts allow-same-origin allow-forms allow-popups" '
              + 'allow="autoplay" title="תצוגת קובץ">'
              + '</iframe>'
            + '</div>' + metaRows;
          // מחק אחרי 10 דקות
          setTimeout(() => _deleteDriveTemp(tempId), 600000);
          return;
        }

        // Fallback אם ה-upload נכשל
        _noPreview('לא הצלחנו לטעון את הקובץ לתצוגה');
        return;
      }

      // Fallback: כפתור הורדה
      const blob    = new Blob([buffer], { type: fetchedMime });
      const blobUrl = URL.createObjectURL(blob);
      _done('<div style="background:var(--surface2);border-radius:10px;padding:24px;text-align:center;margin-bottom:12px;">'
          + '<div style="font-size:40px;margin-bottom:10px;">'+iconLabel+'</div>'
          + '<div style="font-size:13px;color:var(--text-2);margin-bottom:16px;">לחץ להורדת הקובץ</div>'
          + '<a href="'+blobUrl+'" download="'+esc(file.name)+'" '
          + 'style="display:inline-block;padding:11px 24px;border-radius:10px;background:var(--accent);'
          + 'color:white;font-size:14px;font-weight:700;text-decoration:none;font-family:var(--sans);">⬇ הורד קובץ</a>'
          + '</div>');
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);

    } catch(e) {
      console.error('_showFilePreview error:', e);
      _noPreview('שגיאה בטעינת הקובץ: ' + e.message);
    }
  })();
}

// ── העלאת קובץ זמנית ל-Drive לצורך תצוגה מוקדמת ───────────
async function _uploadToDriveTemp(buffer, mimeType, filename) {
  try {
    const boundary = 'fp_temp_' + Date.now();
    const safeName = (filename || 'preview').replace(/[\\/<>:"|?*]/g, '_');

    const meta = JSON.stringify({
      name: '__preview_' + safeName,
      parents: [state.systemFolderId || 'root']
    });

    const body = [
      '--' + boundary,
      'Content-Type: application/json; charset=UTF-8',
      '',
      meta,
      '--' + boundary,
      'Content-Type: ' + (mimeType || 'application/octet-stream'),
      '',
      ''
    ].join('\r\n');

    const bodyBytes = new TextEncoder().encode(body);
    const endBytes  = new TextEncoder().encode('\r\n--' + boundary + '--');
    const full      = new Uint8Array(bodyBytes.length + buffer.byteLength + endBytes.length);
    full.set(bodyBytes, 0);
    full.set(new Uint8Array(buffer), bodyBytes.length);
    full.set(endBytes, bodyBytes.length + buffer.byteLength);

    const r = await fetch(
      'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
      {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + state.token,
          'Content-Type': 'multipart/related; boundary=' + boundary
        },
        body: full
      }
    );
    if (!r.ok) { console.warn('_uploadToDriveTemp failed:', r.status); return null; }
    const data = await r.json();
    return data.id || null;
  } catch(e) {
    console.warn('_uploadToDriveTemp error:', e.message);
    return null;
  }
}

// ── מחיקת קובץ זמני מ-Drive ─────────────────────────────────
async function _deleteDriveTemp(fileId) {
  try {
    await fetch('https://www.googleapis.com/drive/v3/files/' + fileId, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + state.token }
    });
    console.log('[Preview] temp file deleted:', fileId);
  } catch(e) { console.warn('_deleteDriveTemp:', e.message); }
}

// ── renderDetailFiles ─────────────────────────────────────
async function renderDetailFiles(c, f) {
  c.innerHTML = '<div class="loading"><div class="spinner"></div><span>טוען קבצים...</span></div>';

  if (!f.driveFolderId) {
    c.innerHTML = '<div class="empty"><div class="empty-icon">📁</div>'
      + '<div class="empty-title">אין תיקיית Drive לפרויקט</div></div>';
    return;
  }

  try {
    const q = encodeURIComponent(
      "'" + f.driveFolderId + "' in parents and name='files.json' and trashed=false"
    );
    const search = await driveGet(
      'files?q=' + q + '&fields=files(id)&pageSize=1&orderBy=modifiedTime+desc'
    );

    if (!search.files?.length) {
      c.innerHTML = '<div class="empty"><div class="empty-icon">📎</div>'
        + '<div class="empty-title">אין קבצים</div>'
        + '<div class="empty-sub">קבצים שיצורפו למיילים בפרויקט יופיעו כאן</div></div>';
      return;
    }

    const data         = await driveGetFile(search.files[0].id);
    const files        = (data.files || []).filter(f2 => !f2.hidden && !f2.hiddenReason);
    const expectedFiles = (data.expectedFiles || []);

    if (!files.length && !expectedFiles.length) {
      c.innerHTML = '<div class="empty"><div class="empty-icon">📎</div>'
        + '<div class="empty-title">אין קבצים עדיין</div>'
        + '<div class="empty-sub">קבצים שיצורפו למיילים בפרויקט יופיעו כאן</div></div>';
      return;
    }

    // ── שמור קבצים לשימוש חוזר בעת שינוי מיון ──
    c._filesData        = files;
    c._expectedFilesData = expectedFiles;
    c._projectRef       = f;

    _renderFilesContent(c);

  } catch(e) {
    console.error('renderDetailFiles error:', e);
    c.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>'
      + '<div class="empty-title">שגיאה בטעינת קבצים</div>'
      + '<div class="empty-sub">' + esc(e.message) + '</div></div>';
  }
}

function _renderFilesContent(c) {
  const files         = c._filesData || [];
  const expectedFiles = c._expectedFilesData || [];
  const sorted        = _sortFiles(files);

  // ── שורת מיון ──
  const sortBtns = ['name','sender','date','type'].map(s => {
    const labels = {name:'שם', sender:'שולח', date:'תאריך', type:'סוג'};
    const active = _fileSort === s;
    return '<button onclick="_fileSort=\''+s+'\';_renderFilesContent(document.getElementById(\'detail-content\'))" '
      + 'style="padding:4px 10px;border-radius:14px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);'
      + 'border:1.5px solid '+(active?'var(--accent)':'var(--border)')+';'
      + 'background:'+(active?'rgba(26,115,232,.08)':'white')+';'
      + 'color:'+(active?'var(--accent)':'var(--text-2)')+';">'+labels[s]+'</button>';
  }).join('');

  const sortBar = '<div style="display:flex;align-items:center;gap:6px;padding:10px 16px 8px;background:white;border-bottom:1px solid var(--border);">'
    + '<span style="font-size:11px;color:var(--text-3);font-weight:600;">מיון:</span>'
    + sortBtns
    + '</div>';

  let html = sortBar;

  // ── קבצים שהתקבלו — עם כותרות קיבוץ ──
  if (sorted.length) {
    let lastGroup = null;
    const rows = sorted.map(file => {
      const name     = file.name || file.systemName || file.physicalName || 'קובץ';
      const baseName = _fileBaseName(name);
      const iconSvg  = _fileIconSvg(file.mimeType, name);
      const sender   = file.source?.senderName || file.source?.senderEmail
                     || file.senderName || file.sender || '';
      const rawDate  = file.source?.date || file.sentDate || file.detectedAt || file.createdAt;
      const date     = rawDate
        ? new Date(rawDate).toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'2-digit'})
        : '';
      const sizeB    = file.sizeBytes || file.size || 0;
      const size     = sizeB > 0
        ? (sizeB > 1048576 ? Math.round(sizeB/1048576)+'MB' : Math.round(sizeB/1024)+'KB')
        : '';

      const key = 'fpr_' + Math.random().toString(36).slice(2,8);
      window[key] = file;

      // כותרת קבוצה
      const groupKey = _fileGroupKey(file, _fileSort);
      let groupHeader = '';
      if (groupKey !== lastGroup) {
        lastGroup = groupKey;
        groupHeader =
          '<div style="padding:7px 14px 5px;background:var(--surface2);border-bottom:1px solid var(--border);'
          + 'font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.4px;">'
          + esc(groupKey) + '</div>';
      }

      const row = '<div onclick="_showFilePreview(window[\''+key+'\'])" '
        + 'style="display:flex;align-items:center;gap:10px;padding:10px 14px;'
        + 'border-bottom:1px solid var(--surface2);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s;"'
        + 'onmouseenter="this.style.background=\'#f8f9fa\'" onmouseleave="this.style.background=\'\'">'
        + iconSvg
        + '<div style="flex:1;min-width:0;">'
          + '<div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent);">'
            + esc(baseName)
          + '</div>'
          + '<div style="display:flex;gap:8px;margin-top:3px;align-items:center;flex-wrap:wrap;">'
            + (sender ? '<span style="font-size:12px;color:var(--text-2);">'+esc(sender)+'</span>' : '')
            + (date   ? '<span style="font-size:11px;color:var(--text-3);background:var(--surface2);padding:2px 6px;border-radius:4px;">'+date+'</span>' : '')
            + (size   ? '<span style="font-size:11px;color:var(--text-3);">'+size+'</span>' : '')
          + '</div>'
        + '</div>'
        + '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;color:var(--text-3);"><polyline points="6,3 11,8 6,13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '</div>';

      return groupHeader + row;
    }).join('');

    html += '<div class="detail-section">'
      + '<div class="detail-section-title">📎 קבצים שהתקבלו (' + sorted.length + ')</div>'
      + '<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">'
      + rows + '</div></div>';
  }

  // ── קבצים מצופים (ללא שינוי) ──
  if (expectedFiles.length) {
    const rows = expectedFiles.map(ef => {
      const status  = ef.status === 'received' ? '✅' : ef.status === 'overdue' ? '❌' : '⏳';
      const dueDate = ef.dueDate
        ? new Date(ef.dueDate).toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit'})
        : '';
      const from    = ef.expectedFrom?.name || ef.expectedFrom?.email || '';

      return '<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;'
        + 'border-bottom:1px solid var(--surface2);">'
        + '<div style="font-size:20px;flex-shrink:0;">' + status + '</div>'
        + '<div style="flex:1;min-width:0;">'
          + '<div style="font-size:14px;font-weight:600;">' + esc(ef.name || 'קובץ מצופה') + '</div>'
          + '<div style="display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;">'
            + (from    ? '<span style="font-size:11px;color:var(--text-2);">👤 '+esc(from)+'</span>' : '')
            + (dueDate ? '<span style="font-size:11px;color:var(--text-3);">עד '+dueDate+'</span>' : '')
          + '</div>'
        + '</div>'
        + '</div>';
    }).join('');

    html += '<div class="detail-section">'
      + '<div class="detail-section-title">📬 קבצים מצופים (' + expectedFiles.length + ')</div>'
      + '<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">'
      + rows + '</div></div>';
  }

  c.innerHTML = html;
}
