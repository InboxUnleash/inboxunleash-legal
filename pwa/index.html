<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InboxHQ">
<meta name="theme-color" content="#ffffff">
<title>InboxHQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f7fa;--surface:#ffffff;--surface2:#f0f2f5;--surface3:#e8eaed;
  --accent:#1a73e8;--accent-d:#1557b0;--green:#0f9d58;--red:#d93025;
  --yellow:#f29900;--purple:#7c4dff;--text:#202124;--text-2:#5f6368;
  --text-3:#9aa0a6;--border:#e0e0e0;--radius:14px;--sans:'Heebo',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:var(--sans);cursor:pointer;border:none;outline:none}
input,textarea{font-family:var(--sans);outline:none;border:none}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}

/* ── LOGIN ── */
#screen-login{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 32px;text-align:center}
.login-logo{width:72px;height:72px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:28px;box-shadow:0 12px 40px rgba(26,115,232,0.25)}
.login-title{font-size:28px;font-weight:900;letter-spacing:-0.5px;margin-bottom:8px}
.login-sub{font-size:15px;color:var(--text-2);line-height:1.6;margin-bottom:40px}
.btn-google{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);padding:16px 28px;border-radius:50px;font-size:16px;font-weight:600;width:100%;justify-content:center;margin-bottom:16px;transition:all .2s}
.btn-google:active{transform:scale(0.97)}
.btn-google svg{width:22px;height:22px;flex-shrink:0}
.setup-hint{margin-top:32px;padding:16px;background:rgba(242,153,0,.08);border:1px solid rgba(242,153,0,.2);border-radius:var(--radius);font-size:13px;color:var(--yellow);line-height:1.7;text-align:right;display:none}
.setup-hint a{color:var(--accent)}
.error-banner{background:rgba(217,48,37,.08);border:1px solid rgba(217,48,37,.2);color:var(--red);border-radius:var(--radius);padding:14px 16px;font-size:14px;margin-bottom:16px;display:none}

/* ── MAIN ── */

.topbar{display:flex;align-items:center;padding:calc(var(--safe-top) + 8px) 14px 8px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06);gap:0;direction:ltr;}
.topbar-title{font-size:17px;font-weight:900;letter-spacing:-0.3px;line-height:1.2}
.topbar-brand{display:flex;flex-direction:column;justify-content:center;}
.topbar-slogan{font-size:9.5px;color:var(--text-3);margin-top:1px;}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;cursor:pointer;flex-shrink:0}
.topbar-icon-btn{width:28px;height:28px;border-radius:8px;background:none;border:1px solid var(--border);cursor:pointer;display:none;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;}
.tabs{display:flex;padding:5px 8px;gap:4px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x mandatory;}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:4px 10px;border-radius:50px;font-size:13px;font-weight:600;color:var(--text-2);background:transparent;white-space:nowrap;transition:all .15s;border:1.5px solid transparent;flex-shrink:0;scroll-snap-align:start;}
.tab.active{color:var(--accent);background:rgba(26,115,232,.08);border-color:rgba(26,115,232,.2)}
.tab:hover:not(.active){background:var(--surface2);}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:calc(var(--safe-bottom) + 80px)}
#screen-app,#screen-main,#screen-task,#screen-detail{display:flex;flex-direction:column}
#screen-app{flex:1;overflow:hidden}
#screen-main,#screen-task,#screen-detail{flex:1;overflow:hidden}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-num{font-size:26px;font-weight:900;line-height:1;margin-bottom:4px}
.stat-label{font-size:11px;color:var(--text-2);font-weight:500}

/* ══════════════════════════════
   TASK CARD — Gmail style
   ══════════════════════════════ */

/* ── רשימת משימות ── */
.task-list{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:4px}

/* ── שורת משימה בודדת ── */
.task-row{
  display:flex;flex-direction:column;
  border-bottom:1px solid var(--surface2);
  background:#fff;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.task-row:last-child{border-bottom:none}
.task-row.task-row-done{opacity:.55}
.task-row.done-anim{animation:doneSlide .35s ease forwards}
@keyframes doneSlide{0%{opacity:1;max-height:80px}100%{opacity:0;max-height:0;overflow:hidden}}

/* ── שורה ראשית (row-main) ── */
.task-row-main{display:flex;align-items:center;padding:10px 12px 10px 6px;gap:0}

/* ── SVG checkbox ── */
.task-check-svg{width:19px;height:19px;cursor:pointer;flex-shrink:0;opacity:.55;transition:opacity .15s;margin-left:10px;}
.task-check-svg:hover{opacity:1}
.task-check-svg.checked{opacity:1}

/* ── תוכן ── */
.task-row-body{flex:1;min-width:0;cursor:pointer}
.task-row-title{
  font-size:15px;font-weight:600;
  line-height:1.4;margin-bottom:3px;
  color:#202124;
  word-break:break-word;
}
.task-row-title.done{text-decoration:line-through;color:var(--text-3)}
.task-pin{font-size:13px;flex-shrink:0}

/* ── פתקית ── */
.task-sticky{display:flex;align-items:baseline;gap:4px;margin-bottom:3px}
.task-sticky-icon{display:inline-flex;align-items:center;flex-shrink:0;}
.task-sticky-text{font-size:13px;color:var(--text-2);line-height:1.5;flex:1;}

/* ── מטה (תאריך, פרויקט, אחראי…) ── */
.task-meta{display:flex;flex-wrap:wrap;gap:0;align-items:center;font-size:12px;color:var(--text)}

/* ── תפריט פעולות (3 נקודות) ── */
.task-actions{display:flex;align-items:center;gap:1px;flex-shrink:0;padding:0 4px 0 8px;}
.task-menu-btn{width:26px;height:26px;border-radius:7px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:16px;letter-spacing:1px;transition:background .15s;padding-bottom:3px;}
.task-menu-btn:hover{background:var(--surface2);}
.task-dropdown{position:absolute;left:8px;top:calc(100% - 4px);background:white;border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;min-width:160px;overflow:hidden;display:none;}
.task-dropdown.open{display:block;}
.task-dd-item{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;background:transparent;border:none;width:100%;text-align:right;font-family:var(--sans);}
.task-dd-item:hover{background:var(--surface2);}
.task-dd-item svg{width:15px;height:15px;flex-shrink:0;color:var(--text-3);}
.task-dd-item.danger{color:var(--red);}
.task-dd-item.danger svg{color:var(--red);}
.task-dd-sep{height:1px;background:var(--border);margin:3px 0;}

/* ── תתי-משימות ── */
.task-subtasks{margin:0 10px 8px;padding:0;}
.subtask-row{padding:7px 14px 7px 24px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:5px;}
.subtask-num{font-size:11px;color:var(--text-3);flex-shrink:0;min-width:18px;}
.subtask-text{font-size:13px;color:var(--text);flex:1;font-weight:700;}
.subtask-text.done{text-decoration:line-through;color:var(--text-3);font-weight:400;}
.subtask-check{font-size:11px;color:var(--green);flex-shrink:0;}

/* ── קבוצת משימות ── */
.task-group-row{
  display:flex;align-items:center;
  padding:8px 14px;
  background:#f8f9fa;
  border-bottom:1px solid #e8eaed;
  cursor:pointer;
  gap:8px;
  user-select:none;
}
.task-group-row:active{background:#f1f3f4}
.task-group-arrow{font-size:11px;color:var(--text-2);transition:transform .2s;flex-shrink:0}
.task-group-arrow.open{transform:rotate(90deg)}
.task-group-name{font-size:13px;font-weight:700;color:var(--text-2);flex:1}
.task-group-count{font-size:11px;color:var(--text-3);background:var(--surface2);padding:1px 7px;border-radius:10px}

/* ── ישן (שמור לתאימות) ── */
.task-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:0;margin-bottom:2px;display:flex;align-items:stretch;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
.task-urgency-bar{display:none}
.task-check-wrap{display:none}
.task-body{flex:1;min-width:0;padding:12px 14px;cursor:pointer}
.task-text{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px}
.task-text.done{text-decoration:line-through;color:var(--text-3)}
.task-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--text-2)}
.chip.overdue{background:rgba(217,48,37,.08);color:var(--red)}.chip.soon{background:rgba(242,153,0,.08);color:var(--yellow)}.chip.ok{background:rgba(26,115,232,.08);color:var(--accent)}

/* ── EMPTY / LOADING ── */
.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-size:18px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.empty-sub{font-size:14px;line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;color:var(--text-2);font-size:15px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SNACKBAR ── */
.snackbar{position:fixed;bottom:calc(var(--safe-bottom) + 90px);left:50%;transform:translateX(-50%) translateY(20px);background:#202124;color:white;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap;max-width:90vw}
.snackbar.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── PROJECTS LIST ── */
.pv-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:border-color .2s}
.btn-refresh{background:var(--surface2);border:1px solid var(--border);color:var(--text-2);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.btn-refresh:active{transform:rotate(180deg)}

/* ── DETAIL SCREEN ── */
#screen-detail{display:flex;flex-direction:column;flex:1;overflow:hidden}
.detail-topbar{display:flex;align-items:center;padding:calc(var(--safe-top) + 14px) 18px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.detail-title{font-size:17px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-back{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 14px 6px 10px;border-radius:10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-back:active{background:var(--surface3)}
.detail-tabs{display:flex;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.detail-tabs::-webkit-scrollbar{display:none}
.detail-tab{padding:12px 14px;font-size:13px;font-weight:600;color:var(--text-2);background:transparent;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;flex-shrink:0}
.detail-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.detail-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:calc(var(--safe-bottom) + 80px)}

/* ── PROJECT HERO ── */
.project-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hero-icon-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
.hero-name{font-size:22px;font-weight:900;letter-spacing:-0.3px}
.hero-group{font-size:13px;color:var(--text-2);margin-top:2px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hero-stat{text-align:center;background:var(--surface2);border-radius:10px;padding:10px 6px}
.hero-stat-num{font-size:20px;font-weight:900;line-height:1}
.hero-stat-lbl{font-size:10px;color:var(--text-2);margin-top:3px;font-weight:500}
.detail-section{margin-bottom:20px}
.detail-section-title{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.detail-section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── MILESTONE ── */
.milestone-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ms-dot{width:10px;height:10px;min-width:10px;border-radius:50%;border:2px solid var(--text-3)}
.ms-dot.done{background:var(--green);border-color:var(--green)}.ms-dot.overdue{background:var(--red);border-color:var(--red)}.ms-dot.upcoming{border-color:var(--accent)}
.ms-name{flex:1;font-size:14px;font-weight:600}.ms-name.done{text-decoration:line-through;color:var(--text-3)}
.ms-date{font-size:11px;font-family:monospace}

/* ── CONTACT ── */
.contact-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
.contact-avatar{width:34px;height:34px;min-width:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white}
.contact-name{font-size:14px;font-weight:600}.contact-email{font-size:11px;color:var(--text-2)}
.contact-role{font-size:10px;color:var(--accent);background:rgba(26,115,232,.08);padding:1px 6px;border-radius:6px;margin-top:2px;display:inline-block}

/* ── MONEY ── */
.money-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.money-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.money-amount{font-size:20px;font-weight:900;margin-bottom:3px}.money-label{font-size:11px;color:var(--text-2)}
.money-bar-wrap{background:var(--surface2);border-radius:6px;height:8px;overflow:hidden;margin:10px 0 6px}
.money-bar-fill{height:100%;border-radius:6px;transition:width .6s ease}
.money-pct{font-size:12px;color:var(--text-2);text-align:center}
.inst-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.inst-paid-dot{width:8px;height:8px;min-width:8px;border-radius:50%}
.inst-name{flex:1;font-size:13px;font-weight:600}
.inst-amount{font-size:13px;font-weight:700}.inst-date{font-size:11px;color:var(--text-2)}

/* ── TASK DETAIL MODAL ── */
.task-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.task-modal{background:var(--surface);border-radius:24px 24px 0 0;padding:0;width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.task-modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.task-modal-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.task-modal-title{font-size:17px;font-weight:700;flex:1;line-height:1.3}
.task-modal-body{flex:1;overflow-y:auto;padding:16px 20px;padding-bottom:calc(var(--safe-bottom) + 16px)}
.task-detail-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--surface2)}
.task-detail-row:last-child{border-bottom:none}
.task-detail-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0;margin-top:1px}
.task-detail-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.task-detail-value{font-size:14px;font-weight:500;color:var(--text)}
.task-modal-done-btn{width:calc(100% - 40px);margin:12px 20px;padding:14px;border-radius:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.task-modal-done-btn.mark-done{background:var(--green);color:white}
.task-modal-done-btn.mark-open{background:var(--surface2);color:var(--text-2);border:1px solid var(--border)}
.task-modal-done-btn:active{transform:scale(0.97)}
.urgency-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700}
.urgency-1{background:rgba(217,48,37,.1);color:var(--red)}
.urgency-2{background:rgba(242,153,0,.1);color:var(--yellow)}
.urgency-3{background:rgba(26,115,232,.1);color:var(--accent)}
.urgency-4{background:var(--surface2);color:var(--text-3)}

/* ── TASK DETAIL SCREEN ── */
#screen-task{display:flex;flex-direction:column;flex:1;overflow:hidden}
.task-detail-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--surface2)}
.task-detail-row:last-child{border-bottom:none}
.task-detail-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0;margin-top:1px}
.task-detail-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.task-detail-value{font-size:14px;font-weight:500;color:var(--text)}
.urgency-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700}
.urgency-1{background:rgba(217,48,37,.1);color:var(--red)}
.urgency-2{background:rgba(242,153,0,.1);color:var(--yellow)}
.urgency-3{background:rgba(26,115,232,.1);color:var(--accent)}
.urgency-4{background:var(--surface2);color:var(--text-3)}

/* ── SUB-TOPBAR (back button bar) ── */
.sub-topbar{display:flex;align-items:center;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}

/* ── LOGIN SLOGANS ── */
.login-slogan1{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-0.3px}
.login-slogan2{font-size:14px;color:var(--text-2);margin-bottom:36px;font-style:italic}

/* ── SUB-TABS (תת-טאבים — משימות, תזרים, שיווק) ── */

<script>
// ============================================================
//  app.js — InboxHQ PWA
//  מחולק לקטעים:
//  1. STATE
//  2. AUTH
//  3. DRIVE API
//  4. LOAD DATA
//  5. RENDER MAIN
//  6. RENDER PROJECTS
//  7. PROJECT DETAIL
//  8. TASK DETAIL MODAL  ← חדש
//  9. ACTIONS
//  10. UI HELPERS
// ============================================================

// ── 1. STATE ──────────────────────────────────────────────
let state = {
  token: null,
  user: null,
  tasks: [],
  folders: [],
  systemFolderId: null,
  tasksFileId: null,
  foldersFileId: null,
  currentTab: 'tasks',
  currentProject: null,
  currentDetailTab: 'main',
  currentTask: null,
  saving: false,
  pinnedTaskIds:  [],   // נעצים אדומים
  pinnedGreenIds: [],   // נעצים ירוקים
};

async function _loadPins() {
  if (!state.systemFolderId) return;
  try {
    // נעצים אדומים — pinned-tasks.json
    const q1 = encodeURIComponent(`'${state.systemFolderId}' in parents and name='pinned-tasks.json' and trashed=false`);
    const r1  = await driveGet('files?q=' + q1 + '&fields=files(id)&pageSize=1');
    if (r1.files?.length) {
      const d = await driveGetFile(r1.files[0].id);
      state.pinnedTaskIds = d.ids || [];
    }
    // נעצים ירוקים — pinned-by-type.json (כולל את כל ה-IDs מכל הסוגים)
    const q2 = encodeURIComponent(`'${state.systemFolderId}' in parents and name='pinned-by-type.json' and trashed=false`);
    const r2  = await driveGet('files?q=' + q2 + '&fields=files(id)&pageSize=1');
    if (r2.files?.length) {
      const d2 = await driveGetFile(r2.files[0].id);
      // byType: { general: [id, id], payment: [id] } — שטח ל-Set אחד
      const byType = d2.byType || {};
      state.pinnedGreenIds = Object.values(byType).flat();
    }
    // רנדר מחדש עם נעצים
    if (state.currentTab === 'tasks') renderContent();
  } catch(e) {
    console.warn('_loadPins:', e);
  }
}

// ── 2. AUTH ───────────────────────────────────────────────
window.addEventListener('load', () => {
  if (CONFIG.CLIENT_ID === 'YOUR_WEB_CLIENT_ID.apps.googleusercontent.com') {
    document.getElementById('setup-hint').style.display = 'block';
    return;
  }
  // ── בדיקת scope: אם הטוקן הישן הונפק עם drive.file — כפה login מחדש ──
  const savedScope = localStorage.getItem('pa_scope');
  if (savedScope !== 'drive.file.sameclient') {
    localStorage.removeItem('pa_token');
    localStorage.removeItem('pa_token_expiry');
    localStorage.setItem('pa_scope', 'drive.file.sameclient');
    console.log('[Auth] Scope upgraded to drive — forcing re-login');
  }

  const saved = localStorage.getItem('pa_token');
  const expiry = parseInt(localStorage.getItem('pa_token_expiry') || '0');
  // טוקן תקף — כנס ישירות ללא כניסה מחדש
  if (saved && expiry > Date.now() + 60000) {
    state.token = saved;
    showMain();
    loadData();
  } else if (saved && expiry <= Date.now() + 60000) {
    // טוקן פג — נסה לרענן בשקט
    _silentRefresh();
  }
});

function _silentRefresh() {
  try {
    google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: CONFIG.SCOPES + ' https://www.googleapis.com/auth/userinfo.profile',
      prompt: '',
      callback: async (r) => {
        if (r.error || !r.access_token) {
          showScreen('login');
          return;
        }
        state.token = r.access_token;
        const expiry = Date.now() + ((r.expires_in || 3600) * 1000);
        localStorage.setItem('pa_token', state.token);
        localStorage.setItem('pa_token_expiry', String(expiry));
        localStorage.setItem('pa_scope', 'drive.file.sameclient');
        showMain();
        await loadData();
      }
    }).requestAccessToken();
  } catch(e) {
    showScreen('login');
  }
}

function handleLogin() {
  if (CONFIG.CLIENT_ID === 'YOUR_WEB_CLIENT_ID.apps.googleusercontent.com') {
    showError('יש להגדיר Client ID');
    document.getElementById('setup-hint').style.display = 'block';
    return;
  }
  // מובייל: ייתכן popup נחסם — הצג הודעה אם נכשל
  try {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: CONFIG.SCOPES + ' https://www.googleapis.com/auth/userinfo.profile',
      callback: async (r) => {
        if (r.error) {
          showError('שגיאה: ' + r.error);
          // אם popup נחסם במובייל — הצג הנחייה
          if (r.error === 'popup_closed_by_user' || r.error === 'popup_blocked') {
            showError('חלון הכניסה נחסם. נסה לאפשר popups לאתר זה בהגדרות הדפדפן.');
          }
          return;
        }
        state.token = r.access_token;
        const expiry = Date.now() + ((r.expires_in || 3600) * 1000);
        localStorage.setItem('pa_token', state.token);
        localStorage.setItem('pa_token_expiry', String(expiry));
        localStorage.setItem('pa_scope', 'drive.file.sameclient');
        showMain();
        await loadData();
      },
      error_callback: (err) => {
        if (err.type === 'popup_closed') {
          showError('חלון הכניסה נסגר. לחץ שוב על כניסה.');
        } else if (err.type === 'popup_failed_to_open') {
          showError('לא ניתן לפתוח חלון כניסה. אפשר popups עבור אתר זה בדפדפן ונסה שוב.');
        } else {
          showError('שגיאת כניסה: ' + (err.type || 'לא ידוע'));
        }
      }
    });
    client.requestAccessToken();
  } catch(e) {
    showError('שגיאה: ' + e.message);
  }
}

function handleLogout() {
  if (!confirm('להתנתק?')) return;
  localStorage.removeItem('pa_token'); localStorage.removeItem('pa_token_expiry');
  state = { token:null, user:null, tasks:[], folders:[], systemFolderId:null, tasksFileId:null, foldersFileId:null, currentTab:'tasks', currentProject:null, currentDetailTab:'main', currentTask:null, saving:false };
  showScreen('login');
}

// ── 3. DRIVE API ──────────────────────────────────────────
async function driveGet(url) {
  const r = await fetch('https://www.googleapis.com/drive/v3/' + url, {
    headers: { Authorization: 'Bearer ' + state.token }
  });
  if (r.status === 401) { handleLogout(); throw new Error('פג תוקף'); }
  return r.json();
}

async function driveGetFile(id) {
  const r = await fetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media', {
    headers: { Authorization: 'Bearer ' + state.token }
  });
  if (!r.ok) throw new Error('שגיאת קריאה');
  return r.json();
}

async function drivePatch(id, data) {
  const r = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + state.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error('שגיאת שמירה');
  return r.json();
}

// ── 4. LOAD DATA ──────────────────────────────────────────
async function loadData() {
  showScreen('loading');
  setLoadingText('מחפש נתונים...');
  try {
    // ── מצא תיקיית _system (בתוך smartFolders) ──
    // תחילה מצא את תיקיית smartFolders, ואז חפש _system בתוכה
    const s0 = encodeURIComponent("name='smartFolders' and mimeType='application/vnd.google-apps.folder' and 'root' in parents and trashed=false");
    const sfRoot = await driveGet('files?q=' + s0 + '&fields=files(id,name)&spaces=drive&pageSize=1');
    console.log('[LoadData] smartFolders root search:', JSON.stringify(sfRoot));

    let smartFoldersRootId = sfRoot.files?.[0]?.id || null;

    // אם לא נמצא עם root — נסה ללא הגבלת parent (fallback)
    if (!smartFoldersRootId) {
      const s0b = encodeURIComponent("name='smartFolders' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      const sfRoot2 = await driveGet('files?q=' + s0b + '&fields=files(id,name)&spaces=drive&pageSize=5');
      console.log('[LoadData] smartFolders fallback search:', JSON.stringify(sfRoot2));
      smartFoldersRootId = sfRoot2.files?.[0]?.id || null;
    }
    console.log('[LoadData] smartFoldersRootId:', smartFoldersRootId);

    // מצא _system בתוך smartFolders
    if (smartFoldersRootId) {
      const s1 = encodeURIComponent("'" + smartFoldersRootId + "' in parents and name='_system' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      const sf = await driveGet('files?q=' + s1 + '&fields=files(id,name)&spaces=drive&pageSize=1');
      console.log('[LoadData] _system search:', JSON.stringify(sf));
      if (sf.files?.length) state.systemFolderId = sf.files[0].id;
    }

    // fallback: חפש _system בכל מקום
    if (!state.systemFolderId) {
      const s1b = encodeURIComponent("name='_system' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      const sfb = await driveGet('files?q=' + s1b + '&fields=files(id,name)&spaces=drive&pageSize=1');
      console.log('[LoadData] _system fallback search:', JSON.stringify(sfb));
      if (sfb.files?.length) state.systemFolderId = sfb.files[0].id;
    }
    console.log('[LoadData] systemFolderId:', state.systemFolderId);

    // tasks.json
    if (state.systemFolderId) {
      setLoadingText('טוען משימות...');
      const s2 = encodeURIComponent("'" + state.systemFolderId + "' in parents and name='tasks.json' and trashed=false");
      const tf = await driveGet('files?q=' + s2 + '&fields=files(id)&spaces=drive&pageSize=1');
      console.log('[LoadData] tasks.json search:', JSON.stringify(tf));
      if (tf.files?.length) {
        state.tasksFileId = tf.files[0].id;
        const td = await driveGetFile(state.tasksFileId);
        state.tasks = td.tasks || [];
        console.log('[LoadData] tasks loaded:', state.tasks.length);
      }
    }

    // smartFolders/index.json
    setLoadingText('טוען פרויקטים...');
    if (smartFoldersRootId) {
      const s4 = encodeURIComponent("'" + smartFoldersRootId + "' in parents and name='index.json' and trashed=false");
      const idxF = await driveGet('files?q=' + s4 + '&fields=files(id,name)&spaces=drive&pageSize=1');
      console.log('[LoadData] index.json search:', JSON.stringify(idxF));
      if (idxF.files?.length) {
        state.foldersFileId = idxF.files[0].id;
        const pd = await driveGetFile(state.foldersFileId);
        console.log('[LoadData] index.json raw keys:', Object.keys(pd || {}));
        const raw = Array.isArray(pd) ? pd : (pd.smartFolders || pd.folders || []);
        state.folders = raw.filter(f => !f.archived);
        console.log('[LoadData] folders loaded:', state.folders.length, state.folders.map(f=>f.name));
      }
    }

    // פרטי משתמש
    try {
      const me = await fetch('https://www.googleapis.com/oauth2/v1/userinfo', {
        headers: { Authorization: 'Bearer ' + state.token }
      }).then(r => r.json());
      state.user = me;
      const avatarEl = document.getElementById('avatar-btn');
      // תמיד אינישיאלים — ללא תמונה
      avatarEl.textContent = (me.name || me.email || 'U').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    } catch(e) {}

    showScreen('main');
    renderContent();
    // טען נעצים ברקע
    _loadPins().catch(() => {});
  } catch(err) {
    console.error(err);
    showScreen('main');
    showSnack('שגיאה: ' + err.message);
    renderContent();
  }
}

async function refreshData() {
  state.tasks = []; state.folders = [];
  state.systemFolderId = null; state.tasksFileId = null; state.foldersFileId = null;
  await loadData();
}

// ── 5. RENDER MAIN ────────────────────────────────────────
function renderContent() {
  const c = document.getElementById('content');
  updateTopbar();
  switch (state.currentTab) {
    case 'tasks':    renderTasks(c, state.tasks.filter(t => t.status === 'open')); break;
    case 'leads':    _setSubTabsBar(''); renderLeads(c); break;
    case 'projects': _setSubTabsBar(''); renderProjects(c); break;
    case 'team':     _setSubTabsBar(''); renderTeamView(c); break;
    case 'marketing': renderMarketing(c); break;
    case 'cashflow':  renderCashflow(c); break;
    default:         renderTasks(c, state.tasks.filter(t => t.status === 'open')); break;
  }
}

function updateTopbar() {
  // אין כותרת משנה — הסלוגן מוגדר ב-HTML
}

function renderStats() {
  const o = state.tasks.filter(t => t.status === 'open').length;
  const u = state.tasks.filter(t => t.status === 'open' && t.urgency === 1).length;
  const d = state.tasks.filter(t => t.status === 'done').length;
  return '<div class="stats-row">'
    + '<div class="stat-card"><div class="stat-num" style="color:var(--accent)">' + o + '</div><div class="stat-label">פתוחות</div></div>'
    + '<div class="stat-card"><div class="stat-num" style="color:var(--red)">' + u + '</div><div class="stat-label">דחופות</div></div>'
    + '<div class="stat-card"><div class="stat-num" style="color:var(--green)">' + d + '</div><div class="stat-label">הושלמו</div></div>'
    + '</div>';
}

// ── עוזר: מציב תת-טאבים ב-bar הקבוע ──────────────────────
function _setSubTabsBar(html) {
  var bar = document.getElementById('sub-tabs-bar');
  if (bar) bar.innerHTML = html || '';
}

function renderTasks(container, tasks) {
  const sub = state.taskSubTab || 'todo';
  const today = new Date(); today.setHours(0,0,0,0);

  // ── תפריט משנה → ל-bar הקבוע ──
  const subTabs = [
    { id:'today',   label:'היום' },
    { id:'todo',    label:'משימות' },
    { id:'urgent',  label:'דחופות' },
    { id:'dated',   label:'עם תאריך' },
    { id:'someday', label:'מתישהו' },
    { id:'notes',   label:'פתקיות' },
  ];
  _setSubTabsBar('<div style="display:flex;align-items:center;padding:6px 8px;background:white;border-bottom:1px solid var(--border);gap:3px;">'
    + subTabs.map(function(t) {
        var active = sub === t.id;
        return '<button class="sub-tab' + (active ? ' active' : '') + '" onclick="state.taskSubTab=\''+t.id+'\';renderContent()" '
          + 'style="flex:1;min-width:0;padding:4px 1px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'
          + t.label + '</button>';
      }).join('')
    + '<button onclick="openNewTaskModal()" title="משימה חדשה" '
    + 'style="width:28px;height:28px;min-width:28px;border-radius:50%;background:var(--accent);border:none;'
    + 'color:white;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;'
    + 'box-shadow:0 2px 6px rgba(26,115,232,.35);flex-shrink:0;margin-right:2px;font-weight:300;transition:transform .15s;" '
    + 'onmousedown="this.style.transform=\'scale(0.9)\'" onmouseup="this.style.transform=\'scale(1)\'">'
    + '+</button>'
    + '</div>');

  // פתקיות — תצוגה נפרדת
  if (sub === 'notes') {
    _renderStandaloneNotes(container);
    return;
  }

  // ── סינון ──
  let filtered;
  if (sub === 'today') {
    filtered = tasks.filter(function(t) {
      if (!t.dueDate || !t.alertBeforeDays) return false;
      var due = new Date(t.dueDate); due.setHours(0,0,0,0);
      var alertStart = new Date(due); alertStart.setDate(alertStart.getDate() - t.alertBeforeDays);
      return today >= alertStart && today <= due;
    });
  } else if (sub === 'urgent') {
    filtered = tasks.filter(function(t) { return t.urgency === 1 || t.urgency === 2; });
  } else if (sub === 'dated') {
    filtered = tasks.filter(function(t) { return !!t.dueDate; });
  } else if (sub === 'someday') {
    filtered = tasks.filter(function(t) { return !t.dueDate && (!t.urgency || t.urgency >= 4); });
  } else {
    filtered = tasks.filter(function(t) { return t.dueDate || (t.urgency && t.urgency < 4); });
  }

  // empty
  if (!filtered.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><div class="empty-title">אין משימות</div></div>';
    return;
  }

  // ── מיון: נעצים → דחיפות → תאריך ──
  const pinnedRed   = new Set(state.pinnedTaskIds   || []);
  const pinnedGreen = new Set(state.pinnedGreenIds  || []);

  const sorted = [...filtered].sort((a, b) => {
    const ar = pinnedRed.has(a.id) ? 0 : pinnedGreen.has(a.id) ? 1 : 2;
    const br = pinnedRed.has(b.id) ? 0 : pinnedGreen.has(b.id) ? 1 : 2;
    if (ar !== br) return ar - br;
    const ua = a.urgency || 5, ub = b.urgency || 5;
    if (ua !== ub) return ua - ub;
    if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
    if (a.dueDate) return -1; if (b.dueDate) return 1; return 0;
  });

  container.innerHTML =
    '<div class="task-list">' +
    sorted.map((t, i) => taskCardHtml(t, true, i + 1)).join('') +
    '</div>';
}

// ── פתקיות עצמאיות ──────────────────────────────────────
async function _renderStandaloneNotes(container) {
  container.innerHTML = '<div style="padding:16px;"><div class="spinner" style="margin:30px auto;"></div></div>';
  try {
    var notes = [];
    if (state.systemFolderId) {
      var q = encodeURIComponent("'" + state.systemFolderId + "' in parents and name='notes.json' and trashed=false");
      var res = await driveGet('files?q=' + q + '&fields=files(id)&pageSize=1');
      if (res.files && res.files.length) {
        var data = await driveGetFile(res.files[0].id);
        notes = (data.notes || []).filter(function(n) { return !n.archived && !n.projectId && !n.taskId; });
      }
    }
    if (!notes.length) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><div class="empty-title">אין פתקיות</div><div class="empty-sub">פתקיות ללא פרויקט ומשימה יופיעו כאן</div></div>';
      return;
    }
    var rows = notes.map(function(n) {
      var date = n.createdAt ? new Date(n.createdAt).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}) : '';
      return '<div style="background:white;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;border-right:3px solid var(--yellow);box-shadow:0 1px 3px rgba(0,0,0,.04);">'
        + '<div style="font-size:14px;line-height:1.6;white-space:pre-wrap;">' + esc(n.text || '') + '</div>'
        + (date ? '<div style="font-size:11px;color:var(--text-3);margin-top:6px;">' + date + '</div>' : '')
      + '</div>';
    }).join('');
    container.innerHTML = '<div style="padding:16px;">' + rows + '</div>';
  } catch(e) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">שגיאה בטעינת פתקיות</div></div>';
  }
}

// ── taskCardHtml — תצוגת רשימה ──────────────────────────
function taskCardHtml(t, showProj, num) {
  const done       = t.status === 'done';
  const isRedPin   = (state.pinnedTaskIds  || []).includes(t.id);
  const isGreenPin = (state.pinnedGreenIds || []).includes(t.id);

  // ── נעץ ──
  var pinHtml = '';
  if (isRedPin)   pinHtml = '<span style="color:#d93025;font-size:13px;">📌</span>';
  else if (isGreenPin) pinHtml = '<span style="font-size:13px;filter:hue-rotate(95deg) saturate(4) brightness(1.1);">📌</span>';

  // ── תאריך ──
  var dc = '';
  if (t.dueDate) {
    const due = new Date(t.dueDate); const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.ceil((due - today) / 86400000);
    var lbl, clr;
    if      (diff < 0)  { lbl = 'איחור ' + Math.abs(diff) + ' ימים'; clr = '#dc2626'; }
    else if (diff === 0){ lbl = 'להיום';  clr = '#dc2626'; }
    else if (diff === 1){ lbl = 'למחר';   clr = 'var(--text)'; }
    else                { lbl = 'נותרו ' + diff + ' ימים'; clr = 'var(--text)'; }
    dc = '<span style="color:'+clr+';font-size:12px;font-weight:500;">'+lbl+'</span>';
  }

  // ── פרויקט ──
  var pc = '';
  if (showProj && t.linkedProject) {
    const f2 = state.folders.find(function(f) { return f.id === t.linkedProject; });
    if (f2) pc = '<span style="font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:3px;">'+_FOLDER_SVG+esc(f2.name)+'</span>';
  }

  // ── אבן דרך ──
  var mc = t.linkedMilestone ? '<span style="font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:3px;">'+_FLAG_SVG+esc(t.linkedMilestone)+'</span>' : '';

  // ── אחראי ──
  var ac = '';
  if (t.assignee) {
    const aname = t.assignee.name || t.assignee.email || (typeof t.assignee === 'string' ? t.assignee : '');
    if (aname) ac = '<span style="font-size:12px;color:var(--text-3);">'+esc(aname)+'</span>';
  }

  // ── שווי כספי ──
  var amtc = (t.amount && t.amountDirection)
    ? '<span style="font-size:12px;color:'+(t.amountDirection==='income'?'var(--green)':'var(--red)')+';">שווי: '+t.amount.toLocaleString()+' '+(t.amountDirection==='income'?'הכנסה':'הוצאה')+'</span>'
    : '';

  const sep = '<span style="color:var(--text-3);margin:0 3px;font-weight:300;">|</span>';
  const metaParts = [dc, pc, mc, ac, amtc].filter(Boolean);
  const metaHtml = metaParts.join(sep);

  // ── פתקית ──
  var stickyHtml = '';
  if (t.stickyNote) {
    const ds = t.stickyDate
      ? ' — <span style="font-size:9.5px;color:var(--text-3);">' + new Date(t.stickyDate).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'}).replace(/\//g,'.') + '</span>'
      : '';
    stickyHtml = '<div class="task-sticky">'
      + _STICKY_SVG
      + '<span class="task-sticky-text">' + esc(t.stickyNote) + ds + '</span>'
      + '</div>';
  }

  // ── קבצים מצורפים ──
  var filesHtml = '';
  var allFiles = t.linkedFiles || [];
  if (allFiles.length) {
    filesHtml = '<div style="display:flex;flex-direction:column;gap:2px;margin-top:3px;">'
      + allFiles.map(function(file) {
          var name = (file.name || '').replace(/\.[a-zA-Z0-9]{1,6}$/, '');
          return '<div style="display:inline-flex;align-items:center;gap:4px;">' + _CLIP_SVG + '<span style="font-size:11px;color:var(--text-3);">' + esc(name) + '</span></div>';
        }).join('')
      + '</div>';
  }

  // ── ממתינה ל ──
  var waitingHtml = t.waitingFor
    ? '<div class="task-waiting">⏳ ממתינה ל: ' + esc(t.waitingFor) + '</div>'
    : '';

  // ── קבוצת משימות ──
  var groupToggle = '';
  var subtasksHtml = '';
  const isGroup = t.type === 'group' || (t.isGroup && Array.isArray(t.subTasks) && t.subTasks.length);
  if (isGroup && Array.isArray(t.subTasks) && t.subTasks.length) {
    const total = t.subTasks.length;
    const doneCount = t.subTasks.filter(function(s) { return s.done || s.status === 'done'; }).length;
    const clr = doneCount === total ? 'var(--green)' : 'var(--text-2)';
    const chevron = '<svg width="13" height="13" viewBox="0 0 13 13" style="display:inline-block;vertical-align:middle;transform:rotate(0deg);transition:transform .2s;" id="chev-'+t.id+'"><polyline points="3,2 10,6.5 3,11" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    groupToggle = ' <span data-id="'+t.id+'" onclick="event.stopPropagation();_toggleSubtasks(this.dataset.id)" style="cursor:pointer;color:var(--text-3);padding:0 2px;">'+chevron+'</span>'
      + '<span style="font-size:11px;font-weight:600;color:'+clr+';">'+doneCount+'/'+total+'</span>';

    subtasksHtml = '<div class="task-subtasks" id="subtasks-'+t.id+'" style="display:none;">'
      + t.subTasks.map(function(s, si) {
          const sdone = s.done || s.status === 'done';
          var ssticky = '';
          if (s.stickyNote) {
            const ds2 = s.stickyDate ? ' — <span style="font-size:9.5px;color:var(--text-3);">'+new Date(s.stickyDate).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'}).replace(/\//g,'.')+'</span>' : '';
            ssticky = '<div class="task-sticky" style="margin-right:14px;">'+_STICKY_SVG+'<span class="task-sticky-text">'+esc(s.content||'')+ds2+'</span></div>';
          }
          const smenuId = 'smenu-'+t.id+'-'+si;
          return '<div style="padding:7px 14px 7px 24px;border-top:1px dashed var(--border);display:flex;align-items:flex-start;gap:5px;">'
            + '<span class="subtask-num">'+(si+1)+'.</span>'
            + '<div style="flex:1;">'
              + '<div style="display:flex;align-items:center;gap:5px;">'
                + '<span class="subtask-text '+(sdone?'done':'')+'">'+esc(s.content||'')+'</span>'
                + (sdone ? '<span class="subtask-check">✓</span>' : '')
              + '</div>' + ssticky
            + '</div>'
            + '<div style="position:relative;flex-shrink:0;">'+_taskBuildMenu(smenuId, null)+'</div>'
          + '</div>';
        }).join('')
      + '</div>';
  }

  const menuId = 'menu-' + t.id;
  const menuHtml = '<div style="position:relative;flex-shrink:0;">'+_taskBuildMenu(menuId, t.id)+'</div>';

  return '<div class="task-row'+(done?' task-row-done':'')+'" id="task-'+t.id+'">'
    + '<div class="task-row-main">'
      + '<div class="task-row-body" onclick="openTaskDetail(\''+t.id+'\')">'
        + '<div class="task-row-title'+(done?' done':'')+'">'+pinHtml+esc(t.content)+groupToggle+'</div>'
        + waitingHtml
        + stickyHtml
        + (metaHtml ? '<div class="task-meta">' + metaHtml + '</div>' : '')
        + filesHtml
      + '</div>'
      + menuHtml
    + '</div>'
    + subtasksHtml
  + '</div>';
}

function _toggleSubtasks(id) {
  const sub = document.getElementById('subtasks-'+id);
  const chev = document.getElementById('chev-'+id);
  if (!sub) return;
  const open = sub.style.display !== 'none';
  sub.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
}

  _renderCashBody(document.getElementById('cash-body'));
}

function _cashSubTab(id, label) {
  return '<button class="cash-sub-tab' + (_cashTab === id ? ' active' : '') + '" data-tab="' + id + '">' + label + '</button>';
}

function _renderCashBody(body) {
  if (_cashTab === 'collection') _renderCashCollection(body);
  else if (_cashTab === 'flow')  _renderCashFlow(body);
  else                           _renderCashByProject(body);
}

// ── תצוגה 1: לגביה ──────────────────────────────────────
function _renderCashCollection(body) {
  let totalIn = 0, receivedIn = 0;
  const items = [];

  state.folders.forEach(f => {
    const money = f.moneyConfig || f.money;
    if (!money) return;
    const ti = calcIn(money), ri = calcRec(money);
    totalIn    += ti;
    receivedIn += ri;
    const pending = ti - ri;
    if (pending > 0) {
      items.push({ name: f.name, total: ti, received: ri, pending, pct: Math.round(ri/ti*100) });
    }
  });

  items.sort((a,b) => b.pending - a.pending);

  const pending = totalIn - receivedIn;
  const pct = totalIn > 0 ? Math.round(receivedIn / totalIn * 100) : 0;
  const barCol = pct >= 80 ? 'var(--green)' : pct >= 40 ? 'var(--yellow)' : 'var(--red)';

  const rows = items.length ? items.map(p => {
    const col = p.pct >= 80 ? 'var(--green)' : p.pct >= 40 ? 'var(--yellow)' : 'var(--red)';
    return '<div class="cash-row">'
      + '<div style="flex:1;min-width:0;">'
        + '<div class="cash-row-name">' + esc(p.name) + '</div>'
        + '<div class="cash-row-sub">התקבל ₪' + p.received.toLocaleString() + ' מתוך ₪' + p.total.toLocaleString() + '</div>'
      + '</div>'
      + '<div style="text-align:left;flex-shrink:0;">'
        + '<div style="font-size:14px;font-weight:700;color:var(--red);">₪' + p.pending.toLocaleString() + '</div>'
        + '<div style="font-size:11px;color:' + col + ';">' + p.pct + '%</div>'
      + '</div>'
      + '</div>';
  }).join('') : '<div style="padding:16px;font-size:13px;color:var(--text-3);text-align:center;">אין יתרות לגבייה 🎉</div>';

  body.innerHTML =
    '<div class="cash-cards">'
      + _cashCard('ממתין לגבייה', '₪' + pending.toLocaleString(), pending > 0 ? 'var(--red)' : 'var(--green)')
      + _cashCard('התקבל', '₪' + receivedIn.toLocaleString(), 'var(--green)')
    + '</div>'
    + '<div class="cash-progress-box">'
      + '<div style="font-size:13px;color:var(--text-2);margin-bottom:8px;">אחוז גבייה כולל</div>'
      + '<div class="cash-bar-track"><div class="cash-bar-fill" style="width:' + Math.min(100,pct) + '%;background:' + barCol + ';"></div></div>'
      + '<div style="font-size:15px;font-weight:700;color:' + barCol + ';margin-top:6px;">' + pct + '%</div>'
    + '</div>'
    + '<div class="cash-section-title">פירוט לפי פרויקט</div>'
    + '<div class="cash-list">' + rows + '</div>';
}

// ── תצוגה 2: תזרים ──────────────────────────────────────
function _renderCashFlow(body) {
  let totalIn = 0, receivedIn = 0, totalOut = 0, paidOut = 0;

  state.folders.forEach(f => {
    const money = f.moneyConfig || f.money;
    if (!money) return;
    totalIn    += calcIn(money);
    receivedIn += calcRec(money);
    if (money.expenses) money.expenses.forEach(e => {
      totalOut += e.amount || 0;
      if (e.paid) paidOut += e.amount || 0;
    });
  });

  const netTotal    = totalIn - totalOut;
  const netReceived = receivedIn - paidOut;
  const netCol = netReceived >= 0 ? 'var(--green)' : 'var(--red)';

  body.innerHTML =
    '<div class="cash-cards">'
      + _cashCard('הכנסות צפויות',  '₪' + totalIn.toLocaleString(),    'var(--accent)')
      + _cashCard('הכנסות בפועל',   '₪' + receivedIn.toLocaleString(), 'var(--green)')
      + _cashCard('הוצאות צפויות',  '₪' + totalOut.toLocaleString(),   'var(--text-2)')
      + _cashCard('הוצאות בפועל',   '₪' + paidOut.toLocaleString(),    'var(--red)')
    + '</div>'
    + '<div class="cash-net-box">'
      + '<div style="font-size:12px;color:var(--text-3);margin-bottom:4px;">רווח נקי בפועל</div>'
      + '<div style="font-size:28px;font-weight:900;color:' + netCol + ';">₪' + netReceived.toLocaleString() + '</div>'
      + (netTotal !== netReceived
        ? '<div style="font-size:12px;color:var(--text-3);margin-top:4px;">צפוי: ₪' + netTotal.toLocaleString() + '</div>'
        : '')
    + '</div>';
}

// ── תצוגה 3: לפי פרויקט ─────────────────────────────────
function _renderCashByProject(body) {
  const projects = state.folders
    .map(f => {
      const money = f.moneyConfig || f.money;
      if (!money) return null;
      const ti = calcIn(money), ri = calcRec(money);
      const expenses = money.expenses ? money.expenses.reduce((s,e) => s + (e.amount||0), 0) : 0;
      if (!ti && !expenses) return null;
      return { name: f.name, id: f.id, total: ti, received: ri, expenses, pending: ti - ri, pct: ti > 0 ? Math.round(ri/ti*100) : 0 };
    })
    .filter(Boolean)
    .sort((a,b) => b.total - a.total);

  if (!projects.length) {
    body.innerHTML = '<div class="empty"><div class="empty-icon">💰</div><div class="empty-title">אין נתוני תזרים</div></div>';
    return;
  }

  const rows = projects.map(p => {
    const col = p.pct >= 80 ? 'var(--green)' : p.pct >= 40 ? 'var(--yellow)' : 'var(--red)';
    return '<div class="cash-row">'
      + '<div style="flex:1;min-width:0;">'
        + '<div class="cash-row-name">' + esc(p.name) + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">'
          + (p.total   ? '<span class="cash-chip accent">↑ ₪' + p.total.toLocaleString()    + '</span>' : '')
          + (p.received? '<span class="cash-chip green">✓ ₪' + p.received.toLocaleString()  + '</span>' : '')
          + (p.expenses? '<span class="cash-chip red">↓ ₪'   + p.expenses.toLocaleString()  + '</span>' : '')
        + '</div>'
      + '</div>'
      + (p.total > 0
        ? '<div style="text-align:left;flex-shrink:0;">'
            + '<div style="font-size:13px;font-weight:700;color:' + col + ';">' + p.pct + '%</div>'
            + (p.pending > 0 ? '<div style="font-size:11px;color:var(--red);">₪' + p.pending.toLocaleString() + '</div>' : '')
          + '</div>'
        : '')
      + '</div>';
  }).join('');

  body.innerHTML = '<div class="cash-list">' + rows + '</div>';
}

function _cashCard(label, value, color) {
  return '<div class="cash-card">'
    + '<div style="font-size:20px;font-weight:900;color:' + color + ';margin-bottom:3px;">' + value + '</div>'
    + '<div style="font-size:11px;color:var(--text-2);">' + label + '</div>'
    + '</div>';
}

// ── TEAM VIEW ─────────────────────────────────────────────
function renderTeamView(container) {
  // ── קבץ משימות פתוחות לפי assignee ──
  const byPerson = {};   // email → { name, email, tasks[] }

  state.tasks
    .filter(t => t.status === 'open' && t.assignee && (t.assignee.email || t.assignee.name))
    .forEach(t => {
      const email = t.assignee.email || ('__' + t.assignee.name);
      const name  = t.assignee.name  || t.assignee.email || '?';
      if (!byPerson[email]) byPerson[email] = { name, email: t.assignee.email || '', tasks: [] };
      byPerson[email].tasks.push(t);
    });

  const people = Object.values(byPerson)
    .sort((a, b) => a.name.localeCompare(b.name, 'he'));

  if (!people.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">👥</div>'
      + '<div class="empty-title">אין משימות משויכות</div>'
      + '<div class="empty-sub">משימות שיוקצו לאנשי צוות יופיעו כאן</div></div>';
    return;
  }

  const AVATAR_COLORS = ['#1a73e8','#0f9d58','#7c4dff','#f29900','#d93025','#00bcd4','#e91e63','#009688'];

  const html = people.map(person => {
    const col    = AVATAR_COLORS[(person.email || person.name).charCodeAt(0) % AVATAR_COLORS.length];
    const initials = person.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    const open   = person.tasks.length;
    const urgent = person.tasks.filter(t => t.urgency === 1).length;

    // מיין משימות: דחוף ראשון
    const sorted = [...person.tasks].sort((a, b) => (a.urgency||4) - (b.urgency||4));

    const taskRows = sorted.map((t, i) => taskCardHtml(t, true, i + 1)).join('');

    return '<div class="team-person-block">'
      // ── כותרת אדם ──
      + '<div class="team-person-header" onclick="this.nextElementSibling.classList.toggle(\'collapsed\')">'
        + '<div class="team-avatar" style="background:' + col + '">' + initials + '</div>'
        + '<div class="team-person-info">'
          + '<div class="team-person-name">' + esc(person.name) + '</div>'
          + (person.email ? '<div class="team-person-email">' + esc(person.email) + '</div>' : '')
        + '</div>'
        + '<div class="team-person-stats">'
          + '<span class="team-stat-badge">' + open + ' משימות</span>'
          + (urgent ? '<span class="team-stat-badge urgent">' + urgent + ' דחופות</span>' : '')
        + '</div>'
        + '<span class="team-chevron">▾</span>'
      + '</div>'
      // ── רשימת משימות ──
      + '<div class="team-person-tasks">'
        + '<div class="task-list">' + taskRows + '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  const totalAssigned = people.reduce((s, p) => s + p.tasks.length, 0);

  container.innerHTML =
    '<div class="team-summary">'
      + '<span>' + people.length + ' אנשי צוות</span>'
      + '<span>' + totalAssigned + ' משימות משויכות</span>'
    + '</div>'
    + html;

  // bind קבוצות (subtasks toggle)
  container.querySelectorAll('[data-subtask-toggle]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      _toggleSubtasks(btn.dataset.subtaskToggle);
    });
  });
}

// ── 6. RENDER PROJECTS ────────────────────────────────────
function renderProjects(container) {
  if (!state.folders.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><div class="empty-title">אין פרויקטים</div><div class="empty-sub">פתח את התוסף ב-Gmail כדי ליצור פרויקטים</div></div>';
    return;
  }
  container.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">'
    + '<input id="pv-search" placeholder="🔍 חיפוש פרויקט..." style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--text);font-family:var(--sans);" oninput="filterProjects(this.value)">'
    + '<span id="pv-count" style="font-size:12px;color:var(--text-3);white-space:nowrap;">' + state.folders.length + ' פרויקטים</span>'
    + '</div>'
    + '<div id="pv-list">' + _buildProjectRows(state.folders) + '</div>';
}

function _buildProjectRows(folders) {
  const COLORS = ['#1a73e8','#0f9d58','#7c4dff','#f29900','#d93025','#00bcd4','#e91e63'];
  const byProj = {};
  state.tasks.forEach(t => {
    if (t.linkedProject) {
      if (!byProj[t.linkedProject]) byProj[t.linkedProject] = { open:0, done:0 };
      if (t.status === 'open') byProj[t.linkedProject].open++;
      else if (t.status === 'done') byProj[t.linkedProject].done++;
    }
  });

  return folders.map((f, i) => {
    const col = f.color || COLORS[i % COLORS.length];
    const st = byProj[f.id] || { open:0, done:0 };
    const tot = st.open + st.done;
    const pct = tot > 0 ? Math.round(st.done / tot * 100) : 0;
    const ms = (f.milestoneObjects || f.milestones || []).length;
    const contacts = getContacts(f);

    return '<div class="pv-row" id="pvr-' + f.id + '">'
      // שורה ראשית
      + '<div style="display:flex;align-items:center;gap:0;padding:12px 14px;" onclick="togglePvExpand(\'' + f.id + '\')">'
        + '<div style="width:10px;height:10px;min-width:10px;border-radius:50%;background:' + col + ';margin-left:10px;"></div>'
        + '<div style="flex:1;min-width:0;" onclick="event.stopPropagation();openProject(\'' + f.id + '\')">'
          + '<div style="font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(f.name) + '</div>'
          + (f.projectGroup || f.group ? '<div style="font-size:11px;color:var(--text-2);margin-top:1px;">📂 ' + esc(f.projectGroup || f.group) + '</div>' : '')
        + '</div>'
        + '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-right:8px;">'
          + (st.open > 0 ? '<span style="font-size:12px;color:var(--accent);font-weight:700;">✅ ' + st.open + '</span>' : '')
          + (contacts.length > 0 ? '<span style="font-size:12px;color:var(--text-2);">👥 ' + contacts.length + '</span>' : '')
          + (ms > 0 ? '<span style="font-size:12px;color:var(--text-2);">🏁 ' + ms + '</span>' : '')
        + '</div>'
        + '<span id="pvarrow-' + f.id + '" style="color:var(--text-3);font-size:12px;transition:transform .2s;">▶</span>'
      + '</div>'
      // סרגל התקדמות
      + (tot > 0 ? '<div style="height:3px;background:var(--surface2);"><div style="height:100%;width:' + pct + '%;background:' + col + ';"></div></div>' : '')
      // פרטים מורחבים
      + '<div id="pvd-' + f.id + '" style="display:none;border-top:1px solid var(--border);">'
        + _buildProjectExpandDetails(f, st, contacts)
      + '</div>'
    + '</div>';
  }).join('');
}

function _buildProjectExpandDetails(f, st, contacts) {
  const ms = getMilestones(f);
  const openTasks = state.tasks.filter(t => t.linkedProject === f.id && t.status === 'open');
  let html = '';

  // אנשי קשר
  if (contacts.length) {
    html += '<div style="padding:10px 14px;border-bottom:1px solid var(--border);">'
      + '<div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;">👥 אנשי קשר</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:6px;">'
      + contacts.slice(0, 6).map(c => {
          const COLS = ['#1a73e8','#0f9d58','#7c4dff','#f29900','#d93025'];
          const bg = COLS[(c.email || '').charCodeAt(0) % COLS.length];
          const init = (c.name || c.email || '?')[0].toUpperCase();
          return '<div style="display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);">'
            + '<div style="width:22px;height:22px;min-width:22px;border-radius:50%;background:' + bg + ';display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:700;">' + init + '</div>'
            + '<div><div style="font-size:13px;font-weight:600;">' + esc(c.name || c.email) + '</div>'
            + (c.role ? '<div style="font-size:10px;color:var(--accent);">' + esc(c.role) + '</div>' : '')
            + '</div></div>';
        }).join('')
      + '</div></div>';
  }

  // משימות פתוחות
  if (openTasks.length) {
    html += '<div style="padding:10px 14px;border-bottom:1px solid var(--border);">'
      + '<div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;">✅ משימות פתוחות (' + openTasks.length + ')</div>'
      + openTasks.slice(0, 5).map(t => {
          const isOd = t.dueDate && new Date(t.dueDate) < new Date();
          const ds = t.dueDate ? new Date(t.dueDate).toLocaleDateString('he-IL', { day:'2-digit', month:'2-digit' }) : '';
          const urgCol = t.urgency === 1 ? 'var(--red)' : t.urgency === 2 ? 'var(--yellow)' : 'var(--accent)';
          return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;" onclick="event.stopPropagation();openTaskDetail(\'' + t.id + '\')">'
            + '<div style="width:8px;height:8px;min-width:8px;border-radius:50%;background:' + urgCol + ';"></div>'
            + '<span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(t.content) + '</span>'
            + (ds ? '<span style="font-size:11px;color:' + (isOd ? 'var(--red)' : 'var(--text-3)') + ';">' + (isOd ? '⚠ ' : '') + ds + '</span>' : '')
            + '</div>';
        }).join('')
      + (openTasks.length > 5 ? '<div style="font-size:12px;color:var(--accent);padding:4px 0;cursor:pointer;" onclick="event.stopPropagation();openProject(\'' + f.id + '\')">ועוד ' + (openTasks.length - 5) + ' ›</div>' : '')
      + '</div>';
  }

  // אבני דרך ממתינות
  const pendingMs = ms.filter(m => m.status !== 'done');
  if (pendingMs.length) {
    html += '<div style="padding:10px 14px;">'
      + '<div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;">אבני דרך</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:6px;">'
      + pendingMs.slice(0, 5).map(m => {
          const name = typeof m === 'string' ? m : (m.name || '');
          const isOd = (m.due || m.dueDate) && new Date(m.due || m.dueDate) < new Date();
          return '<span style="padding:3px 10px;border-radius:12px;font-size:12px;border:1px solid ' + (isOd ? 'rgba(217,48,37,.3)' : 'var(--border)') + ';color:' + (isOd ? 'var(--red)' : 'var(--text-2)') + ';">' + esc(name) + '</span>';
        }).join('')
      + '</div></div>';
  }

  // כפתור פתח כרטיס מלא
  html += '<div style="padding:12px 14px;display:flex;justify-content:center;">'
    + '<button onclick="event.stopPropagation();openProject(\'' + f.id + '\')" style="background:var(--accent);color:white;border-radius:10px;padding:8px 24px;font-size:14px;font-weight:700;font-family:var(--sans);">פתח כרטיס מלא ›</button>'
    + '</div>';

  return html;
}

function togglePvExpand(id) {
  const details = document.getElementById('pvd-' + id);
  const arrow = document.getElementById('pvarrow-' + id);
  const row = document.getElementById('pvr-' + id);
  if (!details) return;
  const open = details.style.display !== 'none';
  details.style.display = open ? 'none' : 'block';
  if (arrow) arrow.style.transform = open ? '' : 'rotate(90deg)';
  if (row) row.style.borderColor = open ? 'var(--border)' : 'rgba(26,115,232,.4)';
}

function filterProjects(query) {
  const q = (query || '').toLowerCase().trim();
  const filtered = q ? state.folders.filter(f =>
    (f.name || '').toLowerCase().includes(q) || (f.projectGroup || f.group || '').toLowerCase().includes(q)
  ) : state.folders;
  const list = document.getElementById('pv-list');
  const count = document.getElementById('pv-count');
  if (list) list.innerHTML = _buildProjectRows(filtered);
  if (count) count.textContent = filtered.length + ' פרויקטים';
}

// ── 7. PROJECT DETAIL ─────────────────────────────────────
function openProject(folderId) {
  const f = state.folders.find(f => f.id === folderId);
  if (!f) return;
  state.currentProject = f;
  state.currentDetailTab = 'main';
  document.getElementById('detail-project-title').textContent = f.name;
  document.querySelectorAll('.detail-tab').forEach((t, i) => t.classList.toggle('active', i === 0));
  showScreen('detail');

}

function closeDetail() { showScreen('main'); state.currentProject = null; }

function switchDetailTab(tab, btn) {
  state.currentDetailTab = tab;
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderDetailContent();
}

function switchDetailTabByName(tab) {
  const tabs = ['main','tasks','milestones','team','money'];
  const i = tabs.indexOf(tab);
  const btns = document.querySelectorAll('.detail-tab');
  if (i >= 0 && btns[i]) switchDetailTab(tab, btns[i]);
}

function renderDetailContent() {
  const f = state.currentProject;
  if (!f) return;
  const c = document.getElementById('detail-content');
  const pt = state.tasks.filter(t => t.linkedProject === f.id);
  const ot = pt.filter(t => t.status === 'open');
  const dt = pt.filter(t => t.status === 'done');
  switch (state.currentDetailTab) {
    case 'main':       renderDetailMain(c, f, pt, ot, dt); break;
    case 'tasks':      renderDetailTasks(c, f, ot, dt); break;
    case 'milestones': renderDetailMilestones(c, f); break;
    case 'team':       renderDetailTeam(c, f); break;
    case 'money':      renderDetailMoney(c, f, pt); break;
    case 'files':      renderDetailFiles(c, f); break;
  }
}

async function _saveNewTask() {
  const content = (document.getElementById('ntm-content')?.value || '').trim();
  if (!content) {
    const el = document.getElementById('ntm-content');
    if (el) { el.style.borderColor = 'var(--red)'; el.focus(); }
    showSnack('⚠️ יש להזין תיאור משימה');
    return;
  }

  const dueDate   = document.getElementById('ntm-due')?.value    || null;
  const urgency   = parseInt(document.getElementById('ntm-urgency')?.value || '3');
  const projectId = document.getElementById('ntm-project')?.value || null;
  const note      = (document.getElementById('ntm-note')?.value || '').trim();

  const task = {
    id:            'task_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    content,
    createdAt:     new Date().toISOString(),
    status:        'open',
    type:          'general',
    dueDate:       dueDate || null,
    urgency,
    linkedProject: projectId || null,
    stickyNote:    note || null,
    stickyDate:    note ? new Date().toISOString() : null,
    assignee:      null,
    notes:         '',
  };

  // הוסף ל-state
  state.tasks.unshift(task);

  // נסה לשמור ב-Drive
  if (state.tasksFileId) {
    try {
      await drivePatch(state.tasksFileId, { tasks: state.tasks });
    } catch(e) {
      console.warn('_saveNewTask drive error:', e);
    }
  }

  document.getElementById('ntm-overlay')?.remove();
  showSnack('✅ משימה נוספה');
  renderContent();
}

      // ── ACTION BAR ──

// ── פעולות מתוך כרטיס המשימה ──────────────────────────────
function _tdAction(el) {
  var tid    = el.dataset.tid;
  var action = el.dataset.action;
  if      (action === 'back')   { closeTaskScreen(); }
  else if (action === 'done')   { toggleTask(tid).then(function(){ openTaskDetail(tid); }); }
  else if (action === 'focus')  { showSnack('נוסף לטיפול היום'); /* TODO */ }
  else if (action === 'sticky') { showSnack('הוספת פתקית — בקרוב'); /* TODO */ }
  else if (action === 'edit')   { showSnack('עריכה — בקרוב'); /* TODO */ }
  else if (action === 'trash')  { showSnack('מחיקה — בקרוב'); /* TODO */ }
}

function closeTaskScreen() {
  state.currentTask = null;
  if (state.currentProject) showScreen('detail');
  else showScreen('main');
}

// ── 9. ACTIONS ────────────────────────────────────────────
async function toggleTask(id) {
  if (state.saving) return;
  const t = state.tasks.find(t => t.id === id);
  if (!t) return;
  const done = t.status !== 'done';
  const card = document.getElementById('task-' + id);
  if (done && card) { card.style.transition = 'opacity .35s,transform .35s'; card.style.opacity = '0'; card.style.transform = 'translateX(50px)'; await sleep(350); }
  t.status = done ? 'done' : 'open';
  if (state.tasksFileId) {
    state.saving = true;
    showSnack(done ? '✓ משימה הושלמה' : '↩ נפתחה מחדש');
    try { await drivePatch(state.tasksFileId, { tasks: state.tasks }); }
    catch(e) { showSnack('שגיאה בשמירה'); t.status = done ? 'open' : 'done'; }
    state.saving = false;
  }
  if (state.currentProject) renderDetailContent();
  else renderContent();
}

function handleNewTask() {
  const txt = prompt('תוכן המשימה:');
  if (!txt?.trim()) return;
  const t = { id:'task_'+Date.now(), content:txt.trim(), createdAt:new Date().toISOString(), status:'open', type:'general', dueDate:null, urgency:3, linkedProject:state.currentProject?.id||null, assignee:null, notes:'' };
  state.tasks.unshift(t);
  if (state.currentProject) renderDetailContent(); else renderContent();
  if (state.tasksFileId) drivePatch(state.tasksFileId, { tasks: state.tasks }).then(() => showSnack('✓ משימה נוצרה')).catch(() => showSnack('שגיאה'));
}

// ── 10. UI HELPERS ────────────────────────────────────────
function getMilestones(f) { if (f.milestoneObjects?.length) return f.milestoneObjects; return (f.milestones||[]).map(m => typeof m==='string'?{name:m}:m); }
function getContacts(f) { const r=f.rule||{}, all=[...(r.contacts||[]),...(r.addedContacts||[])], d=f.contactDetails||{}; return all.map(email=>{const cd=d[email]||{};return{email,name:cd.name||email.split('@')[0],role:cd.role||''};}).filter(c=>c.email); }
function calcIn(m) { if(!m)return 0;let t=0;if(m.upfront?.enabled)t+=m.upfront.amount||0;(m.installments||[]).forEach(i=>t+=i.amount||0);if(m.hourly?.enabled)t+=(m.hourly.ratePerHour||0)*(m.hourly.estimatedHours||0);if(!t)t=m.totalAmount||0;return Math.round(t); }
function calcRec(m) { if(!m)return 0;let r=0;if(m.upfront?.enabled&&m.upfront.received)r+=m.upfront.amount||0;(m.installments||[]).forEach(i=>{if(i.paid)r+=i.amount||0;});if(m.hourly?.enabled)r+=(m.hourly.ratePerHour||0)*(m.hourly.loggedHours||0);return Math.round(r); }

function msHtml(m) {
  const name = typeof m==='string'?m:(m.name||''), done=m.status==='done', due=m.due||m.dueDate;
  const today = new Date(); today.setHours(0,0,0,0);
  let dc='upcoming', dcolor='var(--text-2)', ds='';
  if (done) dc='done';
  else if (due) { const d=new Date(due); ds=d.toLocaleDateString('he-IL',{day:'numeric',month:'short'}); if(d<today){dc='overdue';dcolor='var(--red)';}else if((d-today)/86400000<=7)dcolor='var(--yellow)'; }
  const amt = m.amount ? '<span class="chip" style="color:var(--green)">💰 ₪'+Number(m.amount).toLocaleString()+'</span>' : '';
  return '<div class="milestone-item"><div class="ms-dot '+dc+'"></div><div class="ms-name '+(done?'done':'')+'" style="flex:1;">'+esc(name)+'</div>'+amt+(ds?'<div class="ms-date" style="color:'+dcolor+'">'+ds+'</div>':'')+'</div>';
}

function ctHtml(ct) {
  const COLS = ['#1a73e8','#0f9d58','#7c4dff','#f29900','#d93025','#00bcd4','#e91e63','#009688'];
  const key  = ct.email || ct.name || '?';
  const col  = COLS[key.charCodeAt(0) % COLS.length];
  const initials = (ct.name || ct.email || '?')
    .split(' ').filter(Boolean).map(w => w[0]).join('').slice(0,2).toUpperCase();
  return '<div class="contact-item">'
    + '<div class="contact-avatar" style="background:' + col + '">' + initials + '</div>'
    + '<div style="min-width:0;flex:1;">'
      + '<div class="contact-name">' + esc(ct.name || ct.email) + '</div>'
      + (ct.name && ct.email ? '<div class="contact-email">' + esc(ct.email) + '</div>' : '')
      + (ct.role ? '<span class="contact-role">' + esc(ct.role) + '</span>' : '')
    + '</div>'
    + '</div>';
}

function renderDetailTeam(c, f) {
  const ct = getContacts(f);
  if (!ct.length) {
    c.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">אין אנשי קשר</div></div>';
    return;
  }
  c.innerHTML = '<div class="detail-section">'
    + '<div class="detail-section-title">👥 אנשי קשר (' + ct.length + ')</div>'
    + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">'
